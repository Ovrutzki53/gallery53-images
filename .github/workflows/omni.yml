name: Omni video
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Exact omni job name (one clip)"
        required: true
permissions:
  contents: write
concurrency:
  group: omni
  cancel-in-progress: false
jobs:
  omni:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U google-genai requests
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/omni.py "${{ github.event.inputs.job }}"
      - name: Commit results
        if: always()
        run: |
          git config user.name "gallery53-bot"
          git config user.email "gallery53-bot@users.noreply.github.com"
          git add out/reels usage 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Omni video [skip ci]"
          git pull --rebase
          git push
