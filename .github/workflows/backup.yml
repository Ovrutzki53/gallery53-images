name: Backup originals
on:
  push:
    paths: ["backup/**.json"]
permissions:
  contents: write
concurrency:
  group: process-images
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python scripts/backup.py
      - run: |
          git config user.name "gallery53-bot"
          git config user.email "gallery53-bot@users.noreply.github.com"
          git add originals
          git diff --cached --quiet || git commit -m "Backup originals [skip ci]"
          git pull --rebase && git push
