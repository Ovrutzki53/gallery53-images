name: Generate video

on:
  push:
    paths: ["video_jobs/**.json"]
  workflow_dispatch:
    inputs:
      jobs:
        description: "Video job names, space separated. Empty = all pending."
        required: false

permissions:
  contents: write

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/video.py ${{ github.event.inputs.jobs }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "gallery53-bot"
          git config user.email "gallery53-bot@users.noreply.github.com"
          git add out_video usage 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Generated video [skip ci]"
          git pull --rebase
          git push
